name: Sync Contributors Wall

on:
  issues:
    types: [closed, reopened, edited]
  release:
    types: [published, edited]
  workflow_run:
    workflows: ["Build & Publish Release"]
    types: [completed]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: sync-contributors
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync and validate site/contributors.json
        run: |
          python tools/sync_contributors.py --write
          python tools/sync_contributors.py --validate

      - name: Publish live contributors data to R2
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 credentials are not configured in repository secrets."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp site/contributors.json "s3://openfocus-downloads/openfocus-meta/contributors.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json" \
            --cache-control "no-store" \
            --only-show-errors \
            --no-progress

      - name: Open or update sync PR when site/contributors.json changed
        run: |
          set -euo pipefail
          if git diff --quiet site/contributors.json; then
            echo "No changes in site/contributors.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/sync-contributors"
          git checkout -B "$branch"
          git add site/contributors.json
          git commit -m "chore(site): sync contributors.json from GitHub issues and releases"
          if ! git push --force-with-lease origin "HEAD:refs/heads/$branch"; then
            echo "::warning::Live R2 snapshot updated, but branch push failed."
            exit 0
          fi
          open_pr="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$open_pr" ]; then
            if ! gh pr create -R "$GITHUB_REPOSITORY" \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "chore(site): sync contributors.json" \
              --body "Automated sync of community GitHub Issues and release version mappings into \`site/contributors.json\` (live R2 snapshot already updated)."; then
              echo "::warning::Live R2 snapshot updated, but GitHub Actions PR creation is disabled in repo settings."
            fi
          fi

name: Build GPU previews

# Independent accelerator builds. These are NOT part of the four stable
# release assets and are never served to the in-app updater: CUDA, ROCm and
# XPU PyTorch wheels all own the `torch` package and cannot share one
# environment. Trigger manually; publish only after the artifact passed the
# real-hardware checklist in docs/GPU_SUPPORT.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built previews to the separate gpu-v<version> prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gpu-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate GPU matrix
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Validate the GPU manifest
        run: python tools/gpu_variants.py validate

      - name: Resolve buildable variants
        id: matrix
        shell: bash
        run: |
          variants="$(python tools/gpu_variants.py matrix)"
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          echo "Buildable GPU variants: $variants"

      - name: Read APP_VERSION
        id: version
        shell: bash
        run: |
          version="$(python -c 'import constants; print(constants.APP_VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.display }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.variants) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Verify the shared accelerator backend is present
        run: python -c "from core import torch_backend; assert torch_backend.KIND_ROCM and torch_backend.KIND_XPU"

      - name: Install ${{ matrix.name }} PyTorch and its runtime
        run: python tools/gpu_variants.py install ${{ matrix.name }}

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the installed PyTorch variant
        run: python tools/gpu_variants.py verify ${{ matrix.name }}

      - name: Write Windows version resource
        run: python tools/write_version_file.py

      - name: Verify the shipped AI model is present
        shell: pwsh
        run: |
          $w = "weights/stackmff_v3_final.pth"
          if (-not (Test-Path $w)) { throw "Missing $w - the release would ship without the AI model." }
          $len = (Get-Item $w).Length
          if ($len -lt 600000) { throw "$w is only $len bytes (expected ~658587)." }
          Write-Output ("AI model present: {0:N0} bytes" -f $len)

      - name: Build with PyInstaller
        run: python tools/gpu_variants.py build ${{ matrix.name }}

      - name: Record the GPU variant in the bundle
        run: python tools/gpu_variants.py mark ${{ matrix.name }} dist/OpenFocus

      - name: Verify bundled torch and accelerator runtimes
        run: python tools/gpu_variants.py verify-bundle ${{ matrix.name }} dist/OpenFocus

      - name: Verify packaged CLI and CPU inference
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/frozen_cli_smoke.py --executable dist/OpenFocus/OpenFocus.exe

      - name: Package preview zip
        id: package
        shell: bash
        run: |
          archive="$(python tools/gpu_variants.py package ${{ matrix.name }} dist/OpenFocus . | tail -n 1)"
          test -s "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          ls -lh "$archive"

      - name: Stage preview zip around GitHub's 2 GiB limit
        shell: bash
        run: |
          set -euo pipefail
          label="v${{ needs.prepare.outputs.version }}"
          staging="dist/release-gpu/${{ matrix.name }}"
          python tools/release_archives.py stage-gpu \
            --label "$label" \
            --zip "${{ steps.package.outputs.archive }}" \
            --out "$staging" \
            --recovery "tools/join_openfocus_parts.ps1" \
            --variant "${{ matrix.name }}"
          python tools/release_archives.py verify-stage \
            --kind gpu-preview \
            --manifest "$staging/OpenFocus-${label}-gpu-${{ matrix.name }}-assets.json" \
            --dir "$staging"
          ls -lh "$staging"

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-gpu-${{ matrix.name }}
          path: dist/release-gpu/${{ matrix.name }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GPU preview prerelease
    needs: [prepare, build]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: OpenFocus-gpu-*
          path: release

      - name: Verify preview splits and GitHub's asset-size limit
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            found=1
            directory="$(dirname "$manifest")"
            python tools/release_archives.py verify-stage \
              --kind gpu-preview --manifest "$manifest" --dir "$directory"
          done < <(find release -type f -name '*-assets.json')
          if [ "$found" -eq 0 ]; then
            echo "::error::No GPU preview manifest was downloaded."
            exit 1
          fi
          rm -rf publish
          mkdir -p publish
          find release -type f ! -name 'join-openfocus-parts.ps1' \
            -exec cp {} publish/ \;
          recovery="$(find release -type f -name 'join-openfocus-parts.ps1' | head -n 1)"
          if [ -z "$recovery" ]; then
            echo "::error::Missing GPU recovery script."
            exit 1
          fi
          cp "$recovery" publish/
          for asset in publish/*; do
            [ -f "$asset" ] || continue
            size="$(stat -c%s "$asset")"
            if [ "$size" -ge 2147483648 ]; then
              echo "::error::Asset is not below GitHub's 2 GiB limit: $asset"
              exit 1
            fi
          done

      - name: Remove stale preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: gpu-v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          mapfile -t wanted < <(find publish -maxdepth 1 -type f -printf '%f\n')
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              OpenFocus-*|join-openfocus-parts.ps1)
                if ! printf '%s\n' "${wanted[@]}" | grep -Fxq "$name"; then
                  echo "Deleting stale preview asset: $name"
                  gh release delete-asset "$TAG" "$name" \
                    --repo "${{ github.repository }}" -y
                fi
                ;;
            esac
          done < <(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')

      - name: Publish (prerelease, never the latest stable release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: gpu-v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## OpenFocus GPU preview

          These are independent accelerator builds, not the stable Windows
          assets. Download them only for hardware validation; the in-app
          updater intentionally ignores this prerelease.

          Built from commit `${{ github.sha }}`.

          GPU zips above GitHub's 2 GiB per-asset limit are published as raw
          `.partNNN` chunks. Download every part, the matching
          `OpenFocus-*-gpu-*-assets.json`, and `join-openfocus-parts.ps1` into
          one folder, then run:
          ```powershell
          powershell -ExecutionPolicy Bypass -File .\join-openfocus-parts.ps1 -Manifest .\OpenFocus-v<version>-gpu-<variant>-assets.json
          ```
          Replace `<version>` with the app version in the manifest name and
          `<variant>` with rocm or xpu. The script verifies every part and the joined
          SHA-256. These previews are not a stable update channel and do not
          update the R2 manifest.

          | Variant | PyTorch | Runtime | Status |
          |---|---|---|---|
          | AMD ROCm | 2.9.1+rocm7.2.1 | Python 3.12 | pending real-hardware validation |
          | Intel XPU | 2.9.1+xpu | Python 3.10 | pending real-hardware validation |

          Requirements:
          - AMD graphics driver 26.2.2 (ROCm 7.2.1 Windows preview) and an
            AMD GPU on AMD's ROCm on Windows compatibility matrix.
          - An Intel Arc / Core Ultra GPU and a driver supported by the XPU
            wheel.

          The CUDA/RTX 3090 build is the normal Windows asset of the stable
          release. See `docs/GPU_SUPPORT.md` for the exact wheel pins,
          limitations and the real-hardware checklist.
          EOF
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" publish/* --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" \
              --title "OpenFocus GPU preview ${{ needs.prepare.outputs.version }}" \
              --notes-file notes.md --prerelease
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "OpenFocus GPU preview ${{ needs.prepare.outputs.version }}" \
              --notes-file notes.md --prerelease \
              --target "${{ github.sha }}" publish/*
          fi

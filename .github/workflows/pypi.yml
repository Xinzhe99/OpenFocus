name: Publish to PyPI

# Runs on every version tag. Publishing uses PyPI Trusted Publishing (OIDC),
# so no API token lives in this repository: configure the publisher once at
# https://pypi.org/manage/account/publishing/ with
#   owner   Xinzhe99
#   repo    OpenFocus
#   workflow pypi.yml
#   env     pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify the version matches the tag
        run: |
          python - <<'PY'
          import os, re, pathlib
          version = re.search(r'APP_VERSION\s*=\s*"([^"]+)"',
                              pathlib.Path('constants.py').read_text()).group(1)
          ref = os.environ['GITHUB_REF_NAME']
          # A manual run has a branch name here, not a tag: there is nothing
          # to compare against, so only report the version.
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              tag = ref.lstrip('v')
              if version != tag:
                  raise SystemExit(f'APP_VERSION {version} != tag {tag}')
          print('version', version, 'ref', ref)
          PY

      - name: Verify neural model checkpoints
        run: |
          test "$(wc -c < weights/stackmff_final.pth)" -gt 20000000
          test "$(wc -c < weights/stackmff_v2_final.pth)" -gt 200000
          test "$(wc -c < weights/stackmff_v3_final.pth)" -gt 600000

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel and source distribution contents
        run: |
          python - <<'PY'
          import glob, pathlib, sys, tarfile, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          sdist = glob.glob('dist/*.tar.gz')[0]
          required = [
              'core/cli.py', 'core/control/protocol.py', 'utils/weights.py',
              'core/models/stackmff_v1/network.py',
              'core/models/stackmff_v2/network.py',
              'core/models/stackmff_v3/network.py',
              'fusion_methods/stackmffv3.py',
              *[f'locales/{p.name}' for p in pathlib.Path('locales').glob('*.py')],
          ]
          weights = {'weights/stackmff_final.pth': 20000000,
                     'weights/stackmff_v2_final.pth': 200000,
                     'weights/stackmff_v3_final.pth': 600000}
          with zipfile.ZipFile(wheel) as archive:
              files = {info.filename: info.file_size for info in archive.infolist()}
          with tarfile.open(sdist, 'r:gz') as archive:
              source = {entry.name.split('/', 1)[1]: entry.size
                        for entry in archive.getmembers() if '/' in entry.name}
          for name, entries in ((wheel, files), (sdist, source)):
              missing = [path for path in [*required, *weights] if path not in entries]
              small = [path for path, size in weights.items()
                       if path in entries and entries[path] < size]
              stale = [path for path in entries if 'stackmffv4' in path]
              if missing or small or stale:
                  sys.exit(f'{name}: missing={missing}, truncated={small}, stale={stale}')
              print(f'{name}: required modules, locales and model weights present')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    # Job-level so the step conditions below can read it: a step's own `env`
    # is not in scope for that step's `if`.
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Wait for the verified desktop release
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(python -c 'from constants import APP_VERSION; print(APP_VERSION)')"
          for attempt in {1..180}; do
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "The desktop release was not published; refusing to publish to PyPI."
          exit 1

      # Two publish paths, in order of preference:
      #   1. PYPI_API_TOKEN (a project-scoped token in repo secrets). Works
      #      today and does not depend on PyPI-side configuration.
      #   2. Trusted Publishing (OIDC) when no token is set. Requires a
      #      publisher registered at
      #      https://pypi.org/manage/account/publishing/ with
      #      owner Xinzhe99 / repo OpenFocus / workflow pypi.yml / env pypi.
      # A tag push therefore publishes without any manual upload.
      - name: Publish with the API token
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing \
            --username __token__ --password "$PYPI_API_TOKEN" dist/*

      - name: Publish with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

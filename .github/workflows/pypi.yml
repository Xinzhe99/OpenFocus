name: Publish to PyPI

# Runs on every version tag. Publishing uses PyPI Trusted Publishing (OIDC),
# so no API token lives in this repository: configure the publisher once at
# https://pypi.org/manage/account/publishing/ with
#   owner   Xinzhe99
#   repo    OpenFocus
#   workflow pypi.yml
#   env     pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify the version matches the tag
        run: |
          python - <<'PY'
          import os, re, pathlib
          version = re.search(r'APP_VERSION\s*=\s*"([^"]+)"',
                              pathlib.Path('constants.py').read_text()).group(1)
          ref = os.environ['GITHUB_REF_NAME']
          # A manual run has a branch name here, not a tag: there is nothing
          # to compare against, so only report the version.
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              tag = ref.lstrip('v')
              if version != tag:
                  raise SystemExit(f'APP_VERSION {version} != tag {tag}')
          print('version', version, 'ref', ref)
          PY

      - name: Verify the AI model ships in the sdist
        run: |
          test -f weights/stackmff_v3_final.pth || {
            echo "weights/stackmff_v3_final.pth is missing"; exit 1; }
          test "$(wc -c < weights/stackmff_v3_final.pth)" -gt 600000 || {
            echo "weights file is truncated"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel contents
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ['weights/stackmff_v3_final.pth',
                      'core/models/stackmff_v3/network.py',
                      'fusion_methods/stackmffv3.py',
                      'locales/__init__.py', 'locales/en.py', 'locales/zh.py',
                      'locales/_extra.py',
                      'locales/de.py', 'locales/fr.py', 'locales/ru.py',
                      'locales/ko.py', 'locales/pt.py', 'locales/it.py',
                      'locales/nl.py', 'locales/pl.py']
          missing = [r for r in required if r not in names]
          stale = [n for n in names if 'stackmffv4' in n]
          if missing: sys.exit(f'missing from wheel: {missing}')
          if stale: sys.exit(f'stale modules in wheel: {stale}')
          print(f'{wheel}: {len(names)} entries, all required files present')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    # Job-level so the step conditions below can read it: a step's own `env`
    # is not in scope for that step's `if`.
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Wait for the verified desktop release
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="v$(python -c 'from constants import APP_VERSION; print(APP_VERSION)')"
          for attempt in {1..180}; do
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "The desktop release was not published; refusing to publish to PyPI."
          exit 1

      # Two publish paths, in order of preference:
      #   1. PYPI_API_TOKEN (a project-scoped token in repo secrets). Works
      #      today and does not depend on PyPI-side configuration.
      #   2. Trusted Publishing (OIDC) when no token is set. Requires a
      #      publisher registered at
      #      https://pypi.org/manage/account/publishing/ with
      #      owner Xinzhe99 / repo OpenFocus / workflow pypi.yml / env pypi.
      # A tag push therefore publishes without any manual upload.
      - name: Publish with the API token
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --skip-existing \
            --username __token__ --password "$PYPI_API_TOKEN" dist/*

      - name: Publish with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

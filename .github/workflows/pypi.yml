name: Publish to PyPI

# Runs on stable version tags. Publishing uses PyPI Trusted Publishing (OIDC),
# so no API token lives in this repository: configure the publisher once at
# https://pypi.org/manage/account/publishing/ with
#   owner   Xinzhe99
#   repo    OpenFocus
#   workflow pypi.yml
#   env     pypi
on:
  push:
    tags: ["v*", "!v*-beta.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve checked-out build identity
        id: resolve
        run: python tools/release_metadata.py --checkout-sha "$(git rev-parse HEAD)" --github-output "$GITHUB_OUTPUT"

      - name: Verify neural model checkpoints
        run: |
          test "$(wc -c < weights/stackmff_final.onnx)" -gt 600000
          test "$(wc -c < weights/stackmff_v2_final.onnx)" -gt 600000
          test "$(wc -c < weights/stackmff_v3_final.onnx)" -gt 600000

  build-wheels:
    needs: identity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}

      - name: Build platform wheels
        uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_ARCHS_MACOS: arm64
          CIBW_OUTPUT_DIR: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build:
    needs: [identity, build-wheels]
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      channel: ${{ needs.identity.outputs.channel }}
      tag: ${{ needs.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Check the wheels and source distribution contents
        run: |
          python - <<'PY'
          import glob, pathlib, sys, tarfile, zipfile
          wheels = sorted(glob.glob('dist/*.whl'))
          sdists = sorted(glob.glob('dist/*.tar.gz'))
          if not wheels or len(sdists) != 1:
              sys.exit(f'Expected >=1 wheels and 1 sdist, got wheels={wheels}, sdists={sdists}')
          sdist = sdists[0]
          required = [
              'constants.py', 'build_identity.py',
              'core/cli.py', 'core/control/protocol.py', 'core/_native.py',
              'utils/weights.py',
              'core/models/stackmff_v1/network.py',
              'core/models/stackmff_v2/network.py',
              'core/models/stackmff_v3/network.py',
              'fusion_methods/stackmffv3.py',
              *[f'locales/{p.name}' for p in pathlib.Path('locales').glob('*.py')],
          ]
          weights = {'weights/stackmff_final.onnx': 600000,
                     'weights/stackmff_v2_final.onnx': 600000,
                     'weights/stackmff_v3_final.onnx': 600000}
          with tarfile.open(sdist, 'r:gz') as archive:
              source = {entry.name.split('/', 1)[1]: entry.size
                        for entry in archive.getmembers() if '/' in entry.name}
          checks = [(sdist, source)]
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  files = {info.filename: info.file_size for info in archive.infolist()}
              if not any(p.startswith('core/_openfocus_native') and (p.endswith('.so') or p.endswith('.pyd')) for p in files):
                  sys.exit(f'{wheel}: missing compiled core._openfocus_native binary')
              checks.append((wheel, files))
          for name, entries in checks:
              missing = [path for path in [*required, *weights] if path not in entries]
              small = [path for path, size in weights.items()
                       if path in entries and entries[path] < size]
              stale = [path for path in entries if 'stackmffv4' in path]
              if missing or small or stale:
                  sys.exit(f'{name}: missing={missing}, truncated={small}, stale={stale}')
              print(f'{name}: required modules, locales, native binary and model weights present')
          PY

      - name: Record distribution identity
        env:
          BUILD_SHA: ${{ needs.identity.outputs.sha }}
          BUILD_VERSION: ${{ needs.identity.outputs.version }}
          BUILD_CHANNEL: ${{ needs.identity.outputs.channel }}
          BUILD_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python tools/release_metadata.py pypi create --identity identity/dist.json \
            --sha "$BUILD_SHA" --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --tag "$BUILD_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-identity
          path: identity/dist.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ needs.build.outputs.channel == 'release' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      BUILD_SHA: ${{ needs.build.outputs.sha }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}
      BUILD_CHANNEL: ${{ needs.build.outputs.channel }}
      BUILD_TAG: ${{ needs.build.outputs.tag }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: dist-identity
          path: identity/

      - name: Verify bound desktop release and distribution
        id: verify
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_metadata.py pypi verify --identity identity/dist.json \
            --sha "$BUILD_SHA" --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --tag "$BUILD_TAG" \
            --upload-dir upload/

      - name: Install token uploader
        if: ${{ env.PYPI_API_TOKEN != '' && steps.verify.outputs.upload_count != '0' }}
        run: python -m pip install --upgrade twine

      - name: Recheck tag before upload
        if: ${{ steps.verify.outputs.upload_count != '0' }}
        run: |
          python tools/release_metadata.py pypi tag --identity identity/dist.json \
            --sha "$BUILD_SHA" --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --tag "$BUILD_TAG"

      - name: Publish with the API token
        if: ${{ env.PYPI_API_TOKEN != '' && steps.verify.outputs.upload_count != '0' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --non-interactive \
            --username __token__ --password "$PYPI_API_TOKEN" upload/*

      - name: Publish with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' && steps.verify.outputs.upload_count != '0' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

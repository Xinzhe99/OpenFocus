name: Publish to PyPI

# Runs on stable version tags. Publishing uses PyPI Trusted Publishing (OIDC),
# so no API token lives in this repository: configure the publisher once at
# https://pypi.org/manage/account/publishing/ with
#   owner   Xinzhe99
#   repo    OpenFocus
#   workflow pypi.yml
#   env     pypi
on:
  push:
    tags: ["v*", "!v*-beta.*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve checked-out build identity
        id: identity
        run: python tools/release_metadata.py --checkout-sha "$(git rev-parse HEAD)" --github-output "$GITHUB_OUTPUT"

      - name: Verify neural model checkpoints
        run: |
          test "$(wc -c < weights/stackmff_final.onnx)" -gt 600000
          test "$(wc -c < weights/stackmff_v2_final.onnx)" -gt 600000
          test "$(wc -c < weights/stackmff_v3_final.onnx)" -gt 600000

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel and source distribution contents
        run: |
          python - <<'PY'
          import glob, pathlib, sys, tarfile, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          sdist = glob.glob('dist/*.tar.gz')[0]
          required = [
              'core/cli.py', 'core/control/protocol.py', 'utils/weights.py',
              'core/models/stackmff_v1/network.py',
              'core/models/stackmff_v2/network.py',
              'core/models/stackmff_v3/network.py',
              'fusion_methods/stackmffv3.py',
              *[f'locales/{p.name}' for p in pathlib.Path('locales').glob('*.py')],
          ]
          weights = {'weights/stackmff_final.onnx': 600000,
                     'weights/stackmff_v2_final.onnx': 600000,
                     'weights/stackmff_v3_final.onnx': 600000}
          with zipfile.ZipFile(wheel) as archive:
              files = {info.filename: info.file_size for info in archive.infolist()}
          with tarfile.open(sdist, 'r:gz') as archive:
              source = {entry.name.split('/', 1)[1]: entry.size
                        for entry in archive.getmembers() if '/' in entry.name}
          for name, entries in ((wheel, files), (sdist, source)):
              missing = [path for path in [*required, *weights] if path not in entries]
              small = [path for path, size in weights.items()
                       if path in entries and entries[path] < size]
              stale = [path for path in entries if 'stackmffv4' in path]
              if missing or small or stale:
                  sys.exit(f'{name}: missing={missing}, truncated={small}, stale={stale}')
              print(f'{name}: required modules, locales and model weights present')
          PY
      - name: Record distribution identity
        env:
          BUILD_SHA: ${{ steps.identity.outputs.sha }}
          BUILD_VERSION: ${{ steps.identity.outputs.version }}
          BUILD_CHANNEL: ${{ steps.identity.outputs.channel }}
          BUILD_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          python tools/release_metadata.py pypi create --identity identity/dist.json \
            --sha "$BUILD_SHA" --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --tag "$BUILD_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-identity
          path: identity/dist.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ needs.build.outputs.channel == 'release' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      BUILD_SHA: ${{ needs.build.outputs.sha }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}
      BUILD_CHANNEL: ${{ needs.build.outputs.channel }}
      BUILD_TAG: ${{ needs.build.outputs.tag }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: dist-identity
          path: identity/

      - name: Verify bound desktop release and distribution
        id: verify
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_metadata.py pypi verify --identity identity/dist.json \
            --sha "$BUILD_SHA" --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --tag "$BUILD_TAG" \
            --upload-dir upload/

      - name: Install token uploader
        if: ${{ env.PYPI_API_TOKEN != '' && steps.verify.outputs.upload_count != '0' }}
        run: python -m pip install --upgrade twine

      - name: Recheck tag before upload
        if: ${{ steps.verify.outputs.upload_count != '0' }}
        run: |
          python tools/release_metadata.py pypi tag --identity identity/dist.json \
            --sha "$BUILD_SHA" --version "$BUILD_VERSION" --channel "$BUILD_CHANNEL" --tag "$BUILD_TAG"

      # Two publish paths, in order of preference:
      #   1. PYPI_API_TOKEN (a project-scoped token in repo secrets). Works
      #      today and does not depend on PyPI-side configuration.
      #   2. Trusted Publishing (OIDC) when no token is set. Requires a
      #      publisher registered at
      #      https://pypi.org/manage/account/publishing/ with
      #      owner Xinzhe99 / repo OpenFocus / workflow pypi.yml / env pypi.
      # A tag push therefore publishes without any manual upload.
      - name: Publish with the API token
        if: ${{ env.PYPI_API_TOKEN != '' && steps.verify.outputs.upload_count != '0' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload --non-interactive \
            --username __token__ --password "$PYPI_API_TOKEN" upload/*

      - name: Publish with Trusted Publishing
        if: ${{ env.PYPI_API_TOKEN == '' && steps.verify.outputs.upload_count != '0' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

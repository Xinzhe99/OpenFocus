name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_suite:
        description: Run the OS-matrix pytest suite and headless wheel checks
        type: boolean
        default: true
      run_engineering:
        description: Run the remote OpenFocus large-source acceptance gates
        type: boolean
        default: false
      run_mosaic_engineering:
        description: Run remote mosaic large-source and encoded-TIFF acceptance
        type: boolean
        default: false

jobs:
  test:
    name: pytest (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_suite }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Qt system libraries and CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0 fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check macOS GUI shutdown
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: python -m pytest -o addopts='' tests/test_gui_lifecycle.py -x -q --timeout=60 --timeout-method=thread

      - name: Check Windows GUI shutdown
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: python -m pytest -o addopts='' tests/test_gui_lifecycle.py tests/test_control_channel.py::test_default_gui_launch_and_cross_process_client tests/test_activity_logging.py -x -q --timeout=90 --timeout-method=thread

      - name: Run test suite
        id: pytest
        shell: bash
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: |
          set +e
          pytest -v --timeout=90 --timeout-method=thread
          pytest_exit=$?
          echo "exit_code=$pytest_exit" >> "$GITHUB_OUTPUT"
          exit "$pytest_exit"

      - name: Capture macOS native backtrace
        if: ${{ failure() && runner.os == 'macOS' && fromJSON(steps.pytest.outputs.exit_code || '0') >= 128 }}
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        run: |
          lldb --batch \
            -o 'settings set target.process.stop-on-exec false' \
            -o 'process handle SIGILL -s true -n false -p true' \
            -o run -k 'thread backtrace all' -k 'register read' \
            -k 'disassemble --pc --count 16' -k 'image list' \
            -- python -m pytest -o addopts='' -vv -s -x \
               --timeout=90 --timeout-method=thread 2>&1 | tee "$RUNNER_TEMP/macos-lldb.txt"

      - name: Upload macOS native crash diagnostics
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ~/Library/Application Support/OpenFocus/logs/openfocus-*.crash.txt
            ~/Library/Application Support/OpenFocus/logs/openfocus-*.log
            ~/Library/Logs/DiagnosticReports/Python*.ips
            ~/Library/Logs/DiagnosticReports/python*.ips
            ~/Library/Logs/DiagnosticReports/pytest*.ips
            ~/Library/Logs/DiagnosticReports/Python*.crash
            ${{ runner.temp }}/macos-lldb.txt
            ~/Library/Logs/DiagnosticReports/python*.crash
            ~/Library/Logs/DiagnosticReports/pytest*.crash
            /Library/Logs/DiagnosticReports/Python*.ips
            /Library/Logs/DiagnosticReports/python*.ips
            /Library/Logs/DiagnosticReports/pytest*.ips
          if-no-files-found: warn
          retention-days: 7

  headless-wheel:
    name: Installed wheel without GUI
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_suite }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Build the installable wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/openfocus-wheel" .
      - name: Exercise the wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/openfocus-headless"
          "$RUNNER_TEMP/openfocus-headless/bin/python" -m pip install "$RUNNER_TEMP"/openfocus-wheel/*.whl
          "$RUNNER_TEMP/openfocus-headless/bin/python" -I tools/headless_wheel_smoke.py

  engineering:
    name: OpenFocus remote engineering acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_engineering }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OPENCV_FOR_THREADS_NUM: '1'
      OPENCV_OPENCL_RUNTIME: disabled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Gate production fusion A, B and C on the reported 4000 fixture
        timeout-minutes: 10
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import sys

          # Children share the runner's available CPUs, capped at four;
          # native library pools remain serial inside the row/frame budget.
          cpus = sorted(os.sched_getaffinity(0))[:4]
          os.sched_setaffinity(0, cpus)
          import cv2
          import numpy as np
          import tifffile
          cv2.setNumThreads(0)
          cv2.ocl.setUseOpenCL(False)
          root = Path(os.environ['RUNNER_TEMP']) / 'openfocus-engineering'
          reports = root / 'reports'
          previews = root / 'previews'
          reports.mkdir(parents=True, exist_ok=True)
          previews.mkdir(parents=True, exist_ok=True)
          sources = root / 'fusion-sources'
          failures = []
          source_hashes = None
          for index, method in enumerate(('openfocus_a', 'openfocus_b', 'openfocus_c')):
              output = root / (method + '.tif')
              report_path = reports / (method + '.json')
              command = [sys.executable, 'tools/fusion_streaming_benchmark.py',
                         '--generate-dir' if index == 0 else '--source-dir', str(sources),
                         '--fixture', 'reported-4000', '--width', '4000', '--height', '4000',
                         '--count', '16', '--channels', '1', '--dtype', 'uint16',
                         '--seed', '7', '--file-order', 'lexical', '--kernel-size', '17', '--method', method,
                         '--entry', 'pipeline', '--load-mode', 'loader', '--alignment', 'none',
                         '--threads', str(len(cpus)), '--resource-preference', 'maximum',
                         '--output', str(output), '--json-output', str(report_path)]
              print(subprocess.list2cmdline(command), flush=True)
              try:
                  subprocess.run(command, check=True, timeout=180)
              except (subprocess.SubprocessError, OSError) as exc:
                  failures.append(f'{method}: {exc}')
                  continue
              report = json.loads(report_path.read_text(encoding='utf-8'))
              errors = []
              fusion_s = report['stages_s']['fusion']
              if not math.isfinite(fusion_s) or not 0 < fusion_s <= 20:
                  errors.append(f'fusion time {fusion_s!r} exceeds 20 seconds or is invalid')
              for field in ('sampled_peak_rss', 'process_high_water_rss'):
                  value = report[field]
                  if not isinstance(value, (int, float)) or not math.isfinite(value) or not 0 < value <= 1024 ** 3:
                      errors.append(f'{field}={value!r} exceeds 1 GiB or is invalid')
              if (len(report['inputs']) != 16 or report['source_shape'] != [4000, 4000, 3]
                      or report['source_dtypes'] != ['uint16']
                      or report['load_pixels_materialized'] is not False
                      or report['fusion_input_types'] != ['SourceFrame']):
                  errors.append('Expected 16 uint16 SourceFrame inputs in the production BGR layout without materialization')
              hashes = [item['sha256'] for item in report['inputs']]
              if source_hashes is None:
                  source_hashes = hashes
              elif hashes != source_hashes:
                  errors.append('Source content/order differs between methods')
              if (report['output_shape'] != [4000, 4000, 3] or report['output_dtype'] != 'uint16'
                      or report['readback_shape'] != [4000, 4000, 3]
                      or report['readback_dtype'] != 'uint16' or report['readback_page_count'] != 1):
                  errors.append('Output report must describe one 4000x4000 uint16 TIFF page')
              with tifffile.TiffFile(output) as written:
                  if len(written.pages) != 1 or written.series[0].shape != (4000, 4000, 3) or written.series[0].dtype != np.dtype('uint16'):
                      errors.append('Actual output must be one 4000x4000 uint16 TIFF page')
              pixels = tifffile.memmap(output)
              preview = cv2.resize(pixels, (512, 512), interpolation=cv2.INTER_AREA)
              del pixels
              low, high = int(preview.min()), int(preview.max())
              if high > low:
                  preview = np.rint((preview.astype(np.float32) - low) * (255.0 / (high - low))).astype(np.uint8)
              else:
                  preview = np.zeros(preview.shape, dtype=np.uint8)
              from utils.image_utils import imwrite_auto
              if not imwrite_auto(str(previews / (method + '.png')), preview, exif=b''):
                  errors.append('Could not write small output preview')
              report['acceptance'] = {'fusion_limit_s': 20, 'rss_limit_bytes': 1024 ** 3,
                                      'allowed_cpus': sorted(os.sched_getaffinity(0)), 'errors': errors}
              report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
              failures.extend(f'{method}: {error}' for error in errors)
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - name: Gate opening 92 JPEG sources at 45 MP
        if: ${{ !cancelled() }}
        timeout-minutes: 17
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          import subprocess
          import sys

          os.sched_setaffinity(0, sorted(os.sched_getaffinity(0))[:2])
          root = Path(os.environ['RUNNER_TEMP']) / 'openfocus-engineering'
          report_path = root / 'reports' / 'source-open.json'
          report_path.parent.mkdir(parents=True, exist_ok=True)
          command = [sys.executable, 'tools/source_open_benchmark.py',
                     '--generate-dir', str(root / 'open-sources'),
                     '--width', '8192', '--height', '5464', '--count', '92',
                     '--json-output', str(report_path), '--max-load-seconds', '2', '--max-rss-mib', '1024']
          print(subprocess.list2cmdline(command), flush=True)
          subprocess.run(command, check=True, timeout=900)
          report = json.loads(report_path.read_text(encoding='utf-8'))
          load_s = report['load_s']
          if not math.isfinite(load_s) or not 0 < load_s < 2:
              raise SystemExit(f'Source-open load_s={load_s!r}; required <2 seconds')
          for field in ('sampled_peak_rss', 'process_high_water_rss'):
              value = report[field]
              if not isinstance(value, (int, float)) or not math.isfinite(value) or not 0 < value <= 1024 ** 3:
                  raise SystemExit(f'Source-open {field}={value!r}; required <=1 GiB')
          if report['frame_count'] != 92 or report['source_shape'] != [5464, 8192, 3]:
              raise SystemExit('Expected 92 RGB 8192x5464 JPEG sources')
          shape = report['first_preview_shape']
          if len(shape) != 3 or shape[2] != 3 or min(shape[:2]) <= 0 or max(shape[:2]) > 1024:
              raise SystemExit(f'Invalid ready display preview shape: {shape!r}')
          PY
      - name: Upload engineering JSON and small previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openfocus-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openfocus-engineering/reports/*.json
            ${{ runner.temp }}/openfocus-engineering/previews/*.png
          if-no-files-found: warn
          retention-days: 14

  mosaic-engineering:
    name: Mosaic remote acceptance (${{ matrix.case }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mosaic_engineering }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [grid4000, source45mp]
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '1'
      OMP_THREAD_LIMIT: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      OPENCV_FOR_THREADS_NUM: '1'
      OPENCV_OPENCL_RUNTIME: disabled
      MOSAIC_CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Gate real large-source composition and streamed readback
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          cpus = sorted(os.sched_getaffinity(0))[:4]
          os.sched_setaffinity(0, cpus)
          case = os.environ['MOSAIC_CASE']
          root = Path(os.environ['RUNNER_TEMP']) / 'mosaic-engineering' / case
          root.mkdir(parents=True, exist_ok=True)
          command = [sys.executable, 'tools/mosaic_engineering_benchmark.py',
                     '--remote-size', '--encoded-inputs', '--dtype', 'uint16',
                     '--tile-sizes', '256', '512', '--levels', '3',
                     '--seam-band', '16', '--seam-precision', '8',
                     '--band-rows', '32', '--threads', str(len(cpus)),
                     '--rss-limit-mib', '1024', '--extra-scenarios',
                     '--scratch-dir', str(root), '--output', str(root / 'mosaic.tif'),
                     '--report', str(root / 'report.json')]
          if case == 'grid4000':
              command += ['--width', '4000', '--height', '4000',
                          '--rows', '4', '--cols', '4', '--channels', '4']
          else:
              command += ['--width', '8192', '--height', '5504',
                          '--rows', '2', '--cols', '2', '--channels', '3']
          print(subprocess.list2cmdline(command), flush=True)
          subprocess.run(command, check=True, timeout=2100)
          PY
      - name: Upload acceptance JSON and bounded previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-engineering-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mosaic-engineering/${{ matrix.case }}/*.json
            ${{ runner.temp }}/mosaic-engineering/${{ matrix.case }}/*.png
          if-no-files-found: warn
          retention-days: 14

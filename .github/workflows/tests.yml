name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v --timeout=90 --timeout-method=thread

  headless-wheel:
    name: Installed wheel without GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Build the installable wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/openfocus-wheel" .
      - name: Exercise the wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/openfocus-headless"
          "$RUNNER_TEMP/openfocus-headless/bin/python" -m pip install "$RUNNER_TEMP"/openfocus-wheel/*.whl
          "$RUNNER_TEMP/openfocus-headless/bin/python" -I tools/headless_wheel_smoke.py

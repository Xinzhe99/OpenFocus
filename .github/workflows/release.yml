name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Two runs for one tag (moved tag, re-run, workflow_dispatch) used to
# delete-then-create the same release concurrently and clobber assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tagged releases match APP_VERSION, optionally with a beta suffix. Branch
  # dispatches only produce preview artifacts and are never published.
  prepare:
    name: Resolve build identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      label: ${{ steps.identity.outputs.label }}
      channel: ${{ steps.identity.outputs.channel }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve version and build label
        id: identity
        shell: bash
        run: python tools/release_metadata.py --checkout-sha "$(git rev-parse HEAD)" --github-output "$GITHUB_OUTPUT"

  release-tests:
    needs: prepare
    if: needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'beta'
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      run_suite: true

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=pyopencl -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller "cmake>=3.18" ninja "nanobind>=2.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check

      - name: Build native C++ extension
        run: python tools/build_native.py

      - name: Verify inference runtime
        run: python -c "import onnxruntime as ort; assert {'CPUExecutionProvider','DmlExecutionProvider'} <= set(ort.get_available_providers())"

      - name: Write Windows version resource
        run: python tools/write_version_file.py

      - name: Verify the shipped AI models are present
        shell: pwsh
        run: |
          foreach ($w in @("weights/stackmff_final.onnx", "weights/stackmff_v2_final.onnx", "weights/stackmff_v3_final.onnx", "weights/stackmff_v4_flash.onnx", "weights/stackmff_final.pth", "weights/stackmff_v2_final.pth", "weights/stackmff_v3_final.pth", "weights/stackmff_v4_flash.pth")) {
            if (-not (Test-Path $w)) { throw "Missing $w - the release would ship without an AI model." }
            $len = (Get-Item $w).Length
            if ($len -lt 600000) { throw "$w is only $len bytes (expected at least 600000)." }
            Write-Output ("AI model {0}: {1:N0} bytes" -f $w, $len)
          }

      - name: Write packaged build identity
        run: python tools/release_metadata.py --write-build-identity build_identity.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --noconsole --noupx `
            --name OpenFocus `
            --contents-directory "_openfocus_runtime_${{ needs.prepare.outputs.label }}" `
            --version-file build/version_info.txt `
            --additional-hooks-dir hooks `
            --icon "assets/OpenFocus.ico" `
            --collect-submodules fusion_methods `
            --hidden-import pyopencl `
            --collect-submodules locales `
            --hidden-import core.algorithm_adapters `
            --hidden-import core._openfocus_native `
            --hidden-import core.depth_map `
            --hidden-import core.registration `
            --hidden-import core.torch_backend `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtNetwork `
            --hidden-import PyQt6.QtSvg `
            --copy-metadata imageio `
            --collect-data dtcwt `
            --exclude-module torch `
            --exclude-module matplotlib `
            --exclude-module tkinter `
            --exclude-module IPython `
            --exclude-module pytest `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.Qt3DCore `
            --exclude-module PyQt6.QtMultimedia `
            --exclude-module PyQt6.QtBluetooth `
            --exclude-module PyQt6.QtDesigner `
            --exclude-module PyQt6.QtQuick `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: Remove incompatible ICU shadow library
        shell: pwsh
        run: |
          # Qt requires the unversioned Windows ICU API.
          $resources = "dist/OpenFocus/_openfocus_runtime_${{ needs.prepare.outputs.label }}"
          $icu = Join-Path $resources "icuuc.dll"
          if (Test-Path $icu) { Remove-Item -Path $icu -Force }
          python tools/verify_frozen_resources.py $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from pathlib import Path; import sys; assert any(p.parent.name == 'pyopencl' for p in Path(sys.argv[1]).rglob('_cl*.pyd')), 'PyOpenCL extension missing from bundle'" $resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Older updaters require this directory to exist in the new payload.
          New-Item -ItemType Directory -Path "dist/OpenFocus/_internal" -Force | Out-Null
          Set-Content -Path "dist/OpenFocus/_internal/legacy-layout.marker" -Value "Compatibility marker for older updaters." -Encoding utf8

      - name: Verify packaged CLI and desktop control
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/frozen_cli_smoke.py --executable dist/OpenFocus/OpenFocus.exe --resources "dist/OpenFocus/_openfocus_runtime_${{ needs.prepare.outputs.label }}"

      - name: Verify upgrade from v1.76.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP "OpenFocus-v1.76.0-windows-x64.zip"
          gh release download v1.76.0 --repo $env:GITHUB_REPOSITORY --pattern "OpenFocus-v1.76.0-windows-x64.zip" --output $previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Path $previous -Algorithm SHA256).Hash
          if ($hash -ne "b125290a52da1ddd90e590f876e583d21d14d74cf563329bb0f00975b834c47a") {
            throw "Unexpected SHA-256 for v1.76.0 Windows ZIP: $hash"
          }
          python tools/frozen_upgrade_smoke.py --executable dist/OpenFocus/OpenFocus.exe --previous-zip $previous --runtime-name "_openfocus_runtime_${{ needs.prepare.outputs.label }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip (portable)
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "dist/OpenFocus/OpenFocus.portable" -Force | Out-Null
          # Python zipfile allowZip64: Compress-Archive cannot be relied on
          # once the Windows bundle passes the ZIP64 threshold.
          python tools/release_archives.py zip-tree --source dist/OpenFocus --output "OpenFocus-${{ needs.prepare.outputs.label }}-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify Windows update deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.publish_release --build-deltas --platform windows-x64
          --label "${{ needs.prepare.outputs.label }}" --directory dist/release-windows

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # The portable marker must never ship inside the installer build:
          # installed copies live in Program Files and must use the normal
          # user-profile settings location, not a portable data folder.
          Remove-Item -Path "dist/OpenFocus/OpenFocus.portable" -Force -ErrorAction SilentlyContinue
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAPP_VERSION=${{ needs.prepare.outputs.label }} `
            /DAPP_VERSION_NUM=${{ needs.prepare.outputs.version }} `
            OpenFocus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item installer/OpenFocus-*-setup.exe .

      - name: Verify installed first launch without a console
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $setup = (Resolve-Path "OpenFocus-${{ needs.prepare.outputs.label }}-setup.exe").Path
          $previous = Join-Path $env:RUNNER_TEMP "OpenFocus-v1.76.0-windows-x64.zip"
          $previousRoot = Join-Path $env:RUNNER_TEMP "OpenFocus-installer-previous"
          python -m zipfile -e $previous $previousRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $previousRoot "OpenFocus"
          Remove-Item -Path "$target/OpenFocus.portable" -Force
          $oldFile = Get-ChildItem "$target/_internal" -File -Recurse | Select-Object -First 1
          if (-not $oldFile) { throw "Previous installation has no runtime files." }
          New-Item -ItemType Directory -Path "$target/_openfocus_runtime_obsolete", "$target/OpenFocusData" -Force | Out-Null
          Set-Content -Path "$target/_openfocus_runtime_obsolete/old.txt" -Value "old runtime"
          Set-Content -Path "$target/OpenFocusData/keep.txt" -Value "user data"
          $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$target`""
          )
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          if ((Test-Path $oldFile.FullName) -or (Test-Path "$target/_openfocus_runtime_obsolete")) {
            throw "Installer retained an obsolete application runtime."
          }
          if ((Get-Content "$target/OpenFocusData/keep.txt" -Raw).Trim() -ne "user data") {
            throw "Installer changed existing user data."
          }
          python tools/frozen_cli_smoke.py --executable "$target/OpenFocus.exe" --installed-startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report Windows package contents
        shell: pwsh
        run: |
          python tools/packaging_report.py `
            --toc build/OpenFocus/Analysis-00.toc --toc build/OpenFocus/COLLECT-00.toc `
            --package dist/OpenFocus `
            --package "OpenFocus-${{ needs.prepare.outputs.label }}-windows-x64.zip" `
            --package "OpenFocus-${{ needs.prepare.outputs.label }}-setup.exe" `
            --output "$env:RUNNER_TEMP/windows-packaging-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: packaging-report-windows
          path: ${{ runner.temp }}/windows-packaging-report.json
          if-no-files-found: error

      - name: Stage Windows assets around GitHub's 2 GiB limit
        shell: pwsh
        run: |
          # Building installers over 2 GiB requires Inno Setup 6.5 or newer.
          python tools/release_archives.py stage-windows `
            --label "${{ needs.prepare.outputs.label }}" `
            --zip "OpenFocus-${{ needs.prepare.outputs.label }}-windows-x64.zip" `
            --setup "OpenFocus-${{ needs.prepare.outputs.label }}-setup.exe" `
            --out "dist/release-windows" `
            --recovery "tools/join_openfocus_parts.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_archives.py verify-stage `
            --manifest "dist/release-windows/OpenFocus-${{ needs.prepare.outputs.label }}-windows-assets.json" `
            --dir "dist/release-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-windows
          path: dist/release-windows/*
          retention-days: 7

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=pyopencl -r requirements.txt
          pip install pyinstaller "cmake>=3.18" ninja "nanobind>=2.0"

      - name: Build native C++ extension
        run: python tools/build_native.py

      - name: Generate .icns icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     assets/OpenFocus.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/OpenFocus.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/OpenFocus.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/OpenFocus.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/OpenFocus.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/OpenFocus.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/OpenFocus.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/OpenFocus.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/OpenFocus.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/OpenFocus.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o OpenFocus.icns

      - name: Verify the shipped AI models are present
        run: |
          for w in weights/stackmff_final.onnx weights/stackmff_v2_final.onnx weights/stackmff_v3_final.onnx weights/stackmff_v4_flash.onnx; do
            test -f "$w" || { echo "Missing $w - the release would ship without an AI model."; exit 1; }
            size=$(wc -c < "$w")
            if [ "$size" -lt 600000 ]; then echo "$w is only $size bytes"; exit 1; fi
            echo "AI model $w: $size bytes"
          done

      - name: Write packaged build identity
        run: python tools/release_metadata.py --write-build-identity build_identity.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --windowed \
            --name OpenFocus \
            --additional-hooks-dir hooks \
            --icon OpenFocus.icns \
            --collect-submodules fusion_methods \
            --hidden-import pyopencl \
            --collect-submodules locales \
            --hidden-import core.algorithm_adapters \
            --hidden-import core._openfocus_native \
            --hidden-import core.depth_map \
            --hidden-import core.registration \
            --hidden-import core.torch_backend \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.QtSvg \
            --copy-metadata imageio \
            --collect-data dtcwt \
            --exclude-module torch \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module IPython \
            --exclude-module pytest \
            --exclude-module PyQt6.QtWebEngineCore \
            --exclude-module PyQt6.Qt3DCore \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtBluetooth \
            --exclude-module PyQt6.QtDesigner \
            --exclude-module PyQt6.QtQuick \
            main.py

      - name: Register macOS project and source types
        run: python packaging/configure_macos_bundle.py dist/OpenFocus.app

      - name: Verify bundled runtime resources
        run: python tools/verify_frozen_resources.py dist/OpenFocus.app/Contents/Resources

      - name: Verify bundled PyOpenCL extension
        run: python -c "from pathlib import Path; assert any(p.parent.name == 'pyopencl' for p in Path('dist/OpenFocus.app/Contents').rglob('_cl*.so')), 'PyOpenCL extension missing from bundle'"

      - name: Ad-hoc codesign
        run: codesign --force --deep -s - dist/OpenFocus.app

      - name: Verify packaged CLI and desktop control
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/frozen_cli_smoke.py --executable dist/OpenFocus.app/Contents/MacOS/OpenFocus

      - name: Package zip (portable)
        run: ditto -c -k --keepParent dist/OpenFocus.app "OpenFocus-${{ needs.prepare.outputs.label }}-macos-arm64.zip"

      - name: Build and verify macOS update deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.publish_release --build-deltas --platform macos-arm64
          --label "${{ needs.prepare.outputs.label }}" --directory .

      - name: Create DMG installer image
        run: |
          # `hdiutil create -srcfolder` fails with "Resource busy" when the
          # bundle it walks is still held (codesign/Spotlight/antivirus on a
          # freshly written .app). Stage a copy, detach anything left mounted,
          # and retry: the same command succeeded on re-run but failed the tag
          # build, which skipped the whole release job.
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto dist/OpenFocus.app "$STAGE/OpenFocus.app"
          ln -s /Applications "$STAGE/Applications" || true
          hdiutil detach /Volumes/OpenFocus 2>/dev/null || true
          DMG="OpenFocus-${{ needs.prepare.outputs.label }}-macos.dmg"
          for attempt in 1 2 3; do
            if hdiutil create -volname "OpenFocus" -srcfolder "$STAGE" \
                 -fs HFS+ -format UDZO -ov "$DMG"; then
              echo "DMG created on attempt $attempt"
              break
            fi
            echo "hdiutil attempt $attempt failed; retrying in 10s"
            [ "$attempt" = 3 ] && { echo "DMG creation failed after 3 attempts"; exit 1; }
            sleep 10
          done
          ls -lh "$DMG"

      - name: Report macOS package contents
        run: |
          python tools/packaging_report.py \
            --toc build/OpenFocus/Analysis-00.toc --toc build/OpenFocus/COLLECT-00.toc \
            --package dist/OpenFocus.app \
            --package "OpenFocus-${{ needs.prepare.outputs.label }}-macos-arm64.zip" \
            --package "OpenFocus-${{ needs.prepare.outputs.label }}-macos.dmg" \
            --output "$RUNNER_TEMP/macos-packaging-report.json"
      - uses: actions/upload-artifact@v5
        with:
          name: packaging-report-macos
          path: ${{ runner.temp }}/macos-packaging-report.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-macos
          path: |
            OpenFocus-*-macos-arm64.zip
            OpenFocus-*-macos-arm64-from-*.ofdelta.zip
            OpenFocus-*-macos-arm64-patch-from-v2.0.0.zip
            OpenFocus-*-macos.dmg
          retention-days: 7

  build-linux:
    name: Build Linux (x86-64)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth weston libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libwayland-client0 libwayland-cursor0 libwayland-egl1
          python -m pip install --upgrade pip
          python -m pip install --only-binary=pyopencl -r requirements.txt pyinstaller "cmake>=3.18" ninja "nanobind>=2.0"
          python tools/build_native.py
          python -m pip check
          python -c "import onnxruntime as ort; assert 'CPUExecutionProvider' in ort.get_available_providers()"
      - name: Verify AI models
        run: |
          for w in weights/stackmff_final.onnx weights/stackmff_v2_final.onnx weights/stackmff_v3_final.onnx weights/stackmff_v4_flash.onnx; do
            test -f "$w" && test "$(wc -c < "$w")" -ge 600000 || { echo "Missing or incomplete model: $w"; exit 1; }
          done
      - name: Write packaged build identity
        run: python tools/release_metadata.py --write-build-identity build_identity.py
      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --onedir --noupx \
            --name OpenFocus --additional-hooks-dir hooks \
            --collect-submodules fusion_methods --hidden-import pyopencl \
            --collect-submodules locales \
            --hidden-import core.algorithm_adapters --hidden-import core._openfocus_native --hidden-import core.depth_map \
            --hidden-import core.registration --hidden-import core.torch_backend \
            --hidden-import PyQt6.QtCore --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets --hidden-import PyQt6.QtNetwork \
            --hidden-import PyQt6.QtSvg --copy-metadata imageio --collect-data dtcwt \
            --exclude-module torch --exclude-module matplotlib --exclude-module tkinter \
            --exclude-module IPython --exclude-module pytest \
            --exclude-module PyQt6.QtWebEngineCore --exclude-module PyQt6.Qt3DCore \
            --exclude-module PyQt6.QtMultimedia --exclude-module PyQt6.QtBluetooth \
            --exclude-module PyQt6.QtDesigner --exclude-module PyQt6.QtQuick main.py
      - name: Verify packaged resources and Qt plugins
        run: |
          python tools/verify_frozen_resources.py dist/OpenFocus/_internal
          python -c "from pathlib import Path; p = Path('dist/OpenFocus/_internal'); assert any(x.parent.name == 'pyopencl' for x in p.rglob('_cl*.so')); assert list(p.rglob('libqxcb.so')); assert list(p.rglob('libqwayland*.so'))"
          cp assets/openfocus.desktop packaging/install_linux_desktop.py dist/OpenFocus/
      - name: Package and verify extracted desktop and CLI
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          tar -C dist -czf "OpenFocus-${{ needs.prepare.outputs.label }}-linux-x86_64.tar.gz" OpenFocus
          mkdir -p "$RUNNER_TEMP/linux-extracted"
          tar -xzf "OpenFocus-${{ needs.prepare.outputs.label }}-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/linux-extracted"
          xvfb-run -a python tools/frozen_cli_smoke.py --executable "$RUNNER_TEMP/linux-extracted/OpenFocus/OpenFocus" --resources "$RUNNER_TEMP/linux-extracted/OpenFocus/_internal"
      - name: Verify extracted desktop on native Wayland
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/openfocus-wayland"
          export WAYLAND_DISPLAY=openfocus-test
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          compositor=$!
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/weston.log" || true; fi
            kill "$compositor" 2>/dev/null || true
            wait "$compositor" 2>/dev/null || true
            rm -rf "$XDG_RUNTIME_DIR"
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break
            kill -0 "$compositor"
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          python tools/frozen_cli_smoke.py --headless-wayland --executable "$RUNNER_TEMP/linux-extracted/OpenFocus/OpenFocus" --resources "$RUNNER_TEMP/linux-extracted/OpenFocus/_internal"

      - name: Build and verify Linux update deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.publish_release --build-deltas --platform linux-x86_64
          --label "${{ needs.prepare.outputs.label }}" --directory .

      - name: Report Linux package contents
        run: |
          python tools/packaging_report.py --toc build/OpenFocus/Analysis-00.toc --toc build/OpenFocus/COLLECT-00.toc --package dist/OpenFocus --package "OpenFocus-${{ needs.prepare.outputs.label }}-linux-x86_64.tar.gz" --output "$RUNNER_TEMP/linux-packaging-report.json"
      - uses: actions/upload-artifact@v5
        with:
          name: packaging-report-linux
          path: ${{ runner.temp }}/linux-packaging-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-linux
          path: |
            OpenFocus-*-linux-x86_64.tar.gz
            OpenFocus-*-linux-x86_64-from-*.ofdelta.zip
            OpenFocus-*-linux-x86_64-patch-from-v2.0.0.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, release-tests, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # Tags only: a workflow_dispatch run on a branch uploads downloadable
    # artifacts for acceptance testing and must never create or overwrite a
    # release or its stable assets.
    if: ${{ needs.prepare.outputs.channel == 'release' || needs.prepare.outputs.channel == 'beta' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5  # CHANGELOG.md for the release notes
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v5
        with:
          pattern: OpenFocus-*
          merge-multiple: true
          path: release

      - name: Create release notes
        env:
          RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cat > release_notes.md <<'EOF'
          ## Downloads

          Windows downloads are available from **https://openfocus.top**.
          GitHub release assets for Windows are raw `.partNNN` chunks when the
          complete file would exceed GitHub's 2 GiB per-asset limit; use
          `OpenFocus-*-windows-assets.json` and `join-openfocus-parts.ps1` to
          rebuild the complete file, or download from the site.

          | Platform | File | Type |
          |----------|------|------|
          | Windows 10/11 (64-bit) | site download, or `OpenFocus-*-setup.exe[.partNNN]` | **Installer** (recommended) |
          | Windows 10/11 (64-bit) | site download, or `OpenFocus-*-windows-x64.zip[.partNNN]` | Portable (unzip and run) |
          | macOS Apple Silicon (M1/M2/M3/M4) | `OpenFocus-*-macos.dmg` | **Installer image** (recommended) |
          | macOS Apple Silicon (M1/M2/M3/M4) | `OpenFocus-*-macos-arm64.zip` | Portable (unzip) |
          | Linux x86-64 (glibc 2.35+) | `OpenFocus-*-linux-x86_64.tar.gz` | Desktop portable (extract and run) |

          ## Installation

          ### Windows (installer)
          1. Run `OpenFocus-*-setup.exe`.
          2. Follow the wizard: choose the install folder, optionally create a desktop shortcut.
          3. Launch OpenFocus from the Start menu or desktop.

          If GitHub shows `OpenFocus-*-setup.exe.partNNN`, first download all
          parts, `OpenFocus-*-windows-assets.json` and
          `join-openfocus-parts.ps1` into one folder, then run:
          ```powershell
          powershell -ExecutionPolicy Bypass -File .\join-openfocus-parts.ps1 -Manifest .\OpenFocus-<tag>-windows-assets.json
          ```
          Replace `<tag>` with the release tag. The script verifies every
          part and the joined SHA-256 before writing the complete installer.

          ### Windows (portable)
          1. Unzip the downloaded file.
          2. Open the `OpenFocus` folder and double-click `OpenFocus.exe`.

          When the portable zip is split, join it with the same script first;
          the manifest verifies both the zip and setup files.

          ### Linux x86-64 (desktop portable)
          1. Extract `OpenFocus-*-linux-x86_64.tar.gz` into a new directory.
          2. Change into that directory and run `./OpenFocus/OpenFocus`.
          3. Optionally run `python3 OpenFocus/install_linux_desktop.py` to add a per-user application-menu entry. The helper refuses to overwrite an existing entry.

          The Linux build targets glibc 2.35 or newer and needs a graphical X11 or Wayland session and the corresponding system libraries. The independent PyPI `openfocus` package is a headless CLI.

          ### macOS (DMG)
          1. Open `OpenFocus-*-macos.dmg`.
          2. Drag `OpenFocus.app` into your `Applications` folder.

          The app is unsigned, so SmartScreen/Gatekeeper may warn on first launch:
          - Windows: click "More info" → "Run anyway".
          - macOS: if you see *"cannot be opened"* or *"is damaged"*, run
            `xattr -cr /Applications/OpenFocus.app` in Terminal, then open normally.
            On macOS 15 Sequoia and later, right-click → Open no longer bypasses
            Gatekeeper; use System Settings → Privacy & Security → Open Anyway.

          ## Full history

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          EOF
          # Keep a translated summary before the common download instructions.
          # Language blocks survive mirroring for in-app selection after fetch.
          python3 - "${{ needs.prepare.outputs.tag }}" <<'PY'
          import os, re, sys
          from pathlib import Path
          from tools.release_archives import DELTA_PLATFORMS
          from utils.release_delta import PATCH_REQUIRED_FROM, legacy_patch_name
          from utils.release_notes import release_notes_markdown
          tag = sys.argv[1]
          version = os.environ["RELEASE_VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[v?" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              raise SystemExit(f"No changelog section found for {tag}")
          notes = open("release_notes.md", encoding="utf-8").read()
          if os.environ["RELEASE_CHANNEL"] == "beta":
              notes = notes.replace(
                  "Windows downloads are available from **https://openfocus.top**.",
                  "This is a beta prerelease. Download its assets from this page.",
              ).replace("site download, or `OpenFocus-", "`OpenFocus-").replace(
                  "rebuild the complete file, or download from the site.",
                  "rebuild the complete file.",
              )
          repo = os.environ["GITHUB_REPOSITORY"]
          legacy_links = []
          for platform in DELTA_PLATFORMS:
              name = legacy_patch_name(tag, platform)
              if (Path("release") / name).is_file():
                  legacy_links.append(f"- [{platform}](https://github.com/{repo}/releases/download/{tag}/{name})")
          if legacy_links:
              heading = "## Update from OpenFocus " + PATCH_REQUIRED_FROM
              intro = ("Download the patch installer for your platform, extract it, and follow its README. "
                       "Save your work before updating. The installer applies only to the published "
                       f"{PATCH_REQUIRED_FROM} build.")
              notes = notes.replace("## Installation", "\n\n".join(
                  (heading, intro, "\n".join(legacy_links), "## Installation")), 1)
          # Publishing requires actual notes in every selectable UI language.
          notes = release_notes_markdown(version) + "\n\n" + notes
          open("release_notes.md", "w", encoding="utf-8").write(notes)
          PY

      - name: Verify the intended release assets
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          manifest="release/OpenFocus-${tag}-windows-assets.json"
          for name in \
            "OpenFocus-${tag}-macos.dmg" \
            "OpenFocus-${tag}-macos-arm64.zip" \
            "OpenFocus-${tag}-linux-x86_64.tar.gz" \
            "join-openfocus-parts.ps1" \
            "OpenFocus-${tag}-windows-assets.json"; do
            if [ ! -s "release/$name" ]; then
              echo "::error::Missing or empty intended release asset: $name"
              exit 1
            fi
          done
          python tools/release_archives.py verify-stage \
            --manifest "$manifest" --dir release
          echo "Release files (parts and whole assets):"
          find release -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          ls -lh release/

      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python -m tools.publish_release --directory release --notes release_notes.md

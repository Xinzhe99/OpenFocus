name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --noconsole --noupx `
            --name OpenFocus `
            --icon "assets/OpenFocus.ico" `
            --add-data "assets;assets" `
            --add-data "weights;weights" `
            --add-data "ui;ui" `
            --add-data "docs;docs" `
            --collect-all PyQt6 `
            --collect-all scipy `
            --copy-metadata imageio `
            --collect-data dtcwt `
            --collect-all torch `
            --collect-all torchvision `
            main.py

      - name: Package zip (portable)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/OpenFocus -DestinationPath "OpenFocus-${{ github.ref_name }}-windows-x64.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAPP_VERSION=${{ github.ref_name }} OpenFocus.iss
          Copy-Item installer/OpenFocus-*-setup.exe .

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-windows
          path: |
            OpenFocus-*-windows-x64.zip
            OpenFocus-*-setup.exe
          retention-days: 7

  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate .icns icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     assets/OpenFocus.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/OpenFocus.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/OpenFocus.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/OpenFocus.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/OpenFocus.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/OpenFocus.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/OpenFocus.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/OpenFocus.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/OpenFocus.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/OpenFocus.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o OpenFocus.icns

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --windowed \
            --name OpenFocus \
            --icon OpenFocus.icns \
            --add-data "assets:assets" \
            --add-data "weights:weights" \
            --add-data "ui:ui" \
            --add-data "docs:docs" \
            --collect-all PyQt6 \
            --collect-all scipy \
            --copy-metadata imageio \
            --collect-data dtcwt \
            --collect-all torch \
            --collect-all torchvision \
            main.py

      - name: Ad-hoc codesign
        run: codesign --force --deep -s - dist/OpenFocus.app

      - name: Package zip (portable)
        run: ditto -c -k --keepParent dist/OpenFocus.app "OpenFocus-${{ github.ref_name }}-macos-arm64.zip"

      - name: Create DMG installer image
        run: |
          hdiutil create -volname "OpenFocus" -srcfolder dist/OpenFocus.app -ov -format UDZO "OpenFocus-${{ github.ref_name }}-macos.dmg"

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-macos
          path: |
            OpenFocus-*-macos-arm64.zip
            OpenFocus-*-macos.dmg
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: release

      - name: Create release notes
        run: |
          cat > release_notes.md <<'EOF'
          ## Downloads

          | Platform | File | Type |
          |----------|------|------|
          | Windows 10/11 (64-bit) | `OpenFocus-*-setup.exe` | **Installer** (recommended) |
          | Windows 10/11 (64-bit) | `OpenFocus-*-windows-x64.zip` | Portable (unzip and run) |
          | macOS Apple Silicon (M1/M2/M3/M4) | `OpenFocus-*-macos.dmg` | **Installer image** (recommended) |
          | macOS Apple Silicon (M1/M2/M3/M4) | `OpenFocus-*-macos-arm64.zip` | Portable (unzip) |

          ## Installation

          ### Windows (installer)
          1. Run `OpenFocus-*-setup.exe`.
          2. Follow the wizard: choose the install folder, optionally create a desktop shortcut.
          3. Launch OpenFocus from the Start menu or desktop.

          ### Windows (portable)
          1. Unzip the downloaded file.
          2. Open the `OpenFocus` folder and double-click `OpenFocus.exe`.

          ### macOS (DMG)
          1. Open `OpenFocus-*-macos.dmg`.
          2. Drag `OpenFocus.app` into your `Applications` folder.

          The app is unsigned, so SmartScreen/Gatekeeper may warn on first launch:
          - Windows: click "More info" → "Run anyway".
          - macOS: if you see *"cannot be opened"* or *"is damaged"*, run
            `xattr -cr /Applications/OpenFocus.app` in Terminal, then open normally.

          ## Changes

          See the commit history for details. This release bundles all fixes and improvements up to this tag.
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Files downloaded:"
          ls -la release/
          # A leftover release from a previously failed run would break "create"
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "OpenFocus ${{ github.ref_name }}" \
          --notes-file release_notes.md \
          release/* \
          || { echo "create/upload failed; retrying upload"; gh release upload "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --clobber; }

name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Two runs for one tag (moved tag, re-run, workflow_dispatch) used to
# delete-then-create the same release concurrently and clobber assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One identity for both platforms. A tag must match constants.APP_VERSION
  # exactly; a branch dispatch produces a clearly labelled preview that is
  # never uploaded to a GitHub release (the release job below is tag-only).
  prepare:
    name: Resolve build identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      label: ${{ steps.identity.outputs.label }}
      channel: ${{ steps.identity.outputs.channel }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Resolve version and build label
        id: identity
        shell: bash
        run: python tools/release_metadata.py --github-output "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.signpath.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the official cp310 Windows CUDA wheel first. The unpinned
          # torch requirement then remains satisfied without fetching a CPU wheel.
          python -m pip install "https://download.pytorch.org/whl/cu124/torch-2.5.1%2Bcu124-cp310-cp310-win_amd64.whl#sha256=6f99d8459369cfd6661c2aee14787592fe50156a33faf9ef643ba04e42d6543f"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check

      - name: Verify CUDA-enabled PyTorch and CPU execution
        shell: pwsh
        run: |
          @'
          import torch
          assert torch.__version__ == "2.5.1+cu124", torch.__version__
          assert torch.version.cuda == "12.4", torch.version.cuda
          # Unlike get_arch_list(), this works on GPU-less CI runners.
          arch = torch._C._cuda_getArchFlags().split()
          assert "sm_86" in arch, arch  # RTX 3090
          assert (torch.tensor([2]) + 1).item() == 3
          print(f"torch {torch.__version__}, CUDA {torch.version.cuda}, architectures {arch}; CPU execution OK")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write Windows version resource
        run: python tools/write_version_file.py

      - name: Verify the shipped AI model is present
        shell: pwsh
        run: |
          $w = "weights/stackmff_v3_final.pth"
          if (-not (Test-Path $w)) { throw "Missing $w - the release would ship without the AI model." }
          $len = (Get-Item $w).Length
          if ($len -lt 600000) { throw "$w is only $len bytes (expected ~658587)." }
          Write-Output ("AI model present: {0:N0} bytes" -f $len)

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --noconsole --noupx `
            --name OpenFocus `
            --version-file build/version_info.txt `
            --additional-hooks-dir hooks `
            --icon "assets/OpenFocus.ico" `
            --add-data "assets;assets" `
            --add-data "weights;weights" `
            --add-data "ui;ui" `
            --add-data "docs;docs" `
            --collect-submodules PyQt6 `
            --collect-submodules fusion_methods `
            --collect-submodules locales `
            --hidden-import core.algorithm_adapters `
            --hidden-import core.depth_map `
            --hidden-import core.registration `
            --hidden-import core.torch_backend `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --hidden-import PyQt6.QtNetwork `
            --collect-all scipy `
            --copy-metadata imageio `
            --collect-data dtcwt `
            --collect-all rawpy `
            --collect-all torch `
            --exclude-module torchvision `
            --exclude-module torch.test `
            --exclude-module torch.utils.tensorboard `
            --exclude-module torch.distributed `
            --exclude-module matplotlib `
            --exclude-module tkinter `
            --exclude-module IPython `
            --exclude-module pytest `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.Qt3DCore `
            --exclude-module PyQt6.QtMultimedia `
            --exclude-module PyQt6.QtBluetooth `
            --exclude-module PyQt6.QtDesigner `
            --exclude-module PyQt6.QtQuick `
            main.py

      - name: Verify bundled PyTorch CUDA libraries
        shell: pwsh
        run: |
          # Compare with the checked wheel, so a CPU-only or incomplete bundle
          # cannot pass just because CUDA works in the build environment.
          $torchLib = python -c "import pathlib, torch; print(pathlib.Path(torch.__file__).parent / 'lib')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimeDlls = @(Get-ChildItem -Path $torchLib -Filter '*.dll' -File)
          if ($runtimeDlls.Count -eq 0) { throw 'PyTorch has no runtime DLLs' }
          foreach ($source in $runtimeDlls) {
            $bundled = Join-Path 'dist/OpenFocus/_internal/torch/lib' $source.Name
            if (-not (Test-Path $bundled)) {
              throw "Missing PyTorch runtime library: $($source.Name)"
            }
            if ($source.Length -ne (Get-Item $bundled).Length) {
              throw "Bundled PyTorch library has the wrong size: $($source.Name)"
            }
          }
          foreach ($name in @('torch_cpu.dll', 'torch_cuda.dll', 'c10_cuda.dll', 'cudart64_12.dll')) {
            $source = Join-Path $torchLib $name
            $bundled = Join-Path 'dist/OpenFocus/_internal/torch/lib' $name
            if (-not (Test-Path $source) -or (Get-FileHash $source).Hash -ne (Get-FileHash $bundled).Hash) {
              throw "Bundled PyTorch library differs from checked wheel: $name"
            }
          }

      - name: Prune build-only files from the bundle
        shell: pwsh
        run: |
          # torch ships headers, .lib import libraries and CMake files that are
          # only used when compiling against it. They are ~80 MB of the bundle
          # and nothing reads them at runtime. Qt's WebEngine/3D/Multimedia
          # plugins are likewise unused by this app.
          $root = "dist/OpenFocus"
          $patterns = @("*.lib", "*.pdb", "*.exp")
          foreach ($pat in $patterns) {
            Get-ChildItem -Path $root -Recurse -Filter $pat -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
          foreach ($dir in @("torch/include", "torch/share", "torch/test")) {
            $p = Join-Path $root "_internal/$dir"
            if (Test-Path $p) { Remove-Item -Path $p -Recurse -Force }
          }
          $before = (Get-ChildItem $root -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output ("bundle after prune: {0:N0} MB" -f ($before/1MB))

      - name: Detect SignPath signing configuration
        id: signpath
        # Never sign a branch acceptance build with the official version.
        if: needs.prepare.outputs.channel == 'release'
        shell: pwsh
        env:
          API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          EXE_CONFIG: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG }}
          SETUP_CONFIG: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIG }}
        run: |
          $values = [ordered]@{
            SIGNPATH_API_TOKEN = $env:API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNING_POLICY_SLUG
            SIGNPATH_EXE_ARTIFACT_CONFIG = $env:EXE_CONFIG
            SIGNPATH_SETUP_ARTIFACT_CONFIG = $env:SETUP_CONFIG
          }
          $missing = @($values.Keys | Where-Object {
            [string]::IsNullOrWhiteSpace($values[$_])
          })
          if ($missing.Count -eq $values.Count) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "SignPath signing disabled (no configuration found)."
            exit 0
          }
          if ($missing.Count -gt 0) {
            throw "Incomplete SignPath configuration; missing: $($missing -join ', ')."
          }
          "enabled=true" >> $env:GITHUB_OUTPUT
          Write-Output "SignPath signing enabled."

      - name: Upload unsigned executable
        id: upload-exe
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: openfocus-exe-unsigned
          path: dist/OpenFocus/OpenFocus.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign executable with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/signed-exe
          parameters: |
            version: "${{ needs.prepare.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600

      - name: Restore signed executable
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP "signed-exe/OpenFocus.exe"
          if (-not (Test-Path $signed)) {
            throw "SignPath did not return OpenFocus.exe."
          }
          Copy-Item $signed "dist/OpenFocus/OpenFocus.exe" -Force
          $sig = Get-AuthenticodeSignature "dist/OpenFocus/OpenFocus.exe"
          if ($sig.Status -ne "Valid") {
            throw "Signed executable is not valid: $($sig.Status) $($sig.StatusMessage)"
          }
          Write-Output ("Signed by: {0}" -f $sig.SignerCertificate.Subject)

      - name: Verify packaged CLI and desktop control
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/frozen_cli_smoke.py --executable dist/OpenFocus/OpenFocus.exe

      - name: Package zip (portable)
        shell: pwsh
        run: |
          New-Item -ItemType File -Path "dist/OpenFocus/OpenFocus.portable" -Force | Out-Null
          # Python zipfile allowZip64: Compress-Archive cannot be relied on
          # once the Windows bundle passes the ZIP64 threshold.
          python tools/release_archives.py zip-tree --source dist/OpenFocus --output "OpenFocus-${{ needs.prepare.outputs.label }}-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # The portable marker must never ship inside the installer build:
          # installed copies live in Program Files and must use the normal
          # user-profile settings location, not a portable data folder.
          Remove-Item -Path "dist/OpenFocus/OpenFocus.portable" -Force -ErrorAction SilentlyContinue
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAPP_VERSION=${{ needs.prepare.outputs.label }} `
            /DAPP_VERSION_NUM=${{ needs.prepare.outputs.version }} `
            OpenFocus.iss
          Copy-Item installer/OpenFocus-*-setup.exe .

      - name: Upload unsigned installer
        id: upload-setup
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: openfocus-setup-unsigned
          path: OpenFocus-*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/signed-setup
          parameters: |
            version: "${{ needs.prepare.outputs.version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600

      - name: Restore signed installer
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP/signed-setup/OpenFocus-*-setup.exe" |
            Select-Object -First 1
          if (-not $setup) {
            throw "SignPath did not return the installer."
          }
          Copy-Item $setup.FullName . -Force
          $sig = Get-AuthenticodeSignature $setup.FullName
          if ($sig.Status -ne "Valid") {
            throw "Signed installer is not valid: $($sig.Status) $($sig.StatusMessage)"
          }
          Write-Output ("Signed by: {0}" -f $sig.SignerCertificate.Subject)

      - name: Verify installed first launch without a console
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $setup = (Resolve-Path "OpenFocus-${{ needs.prepare.outputs.label }}-setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "OpenFocus-installed"
          $install = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$target`""
          )
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          python tools/frozen_cli_smoke.py --executable "$target/OpenFocus.exe" --installed-startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Windows assets around GitHub's 2 GiB limit
        shell: pwsh
        run: |
          # SignPath (when enabled) has already signed the full setup above;
          # splitting raw bytes preserves that signature. Unsigned builds follow
          # the same split path. Prerequisites: the installed Inno Setup must
          # support a >2 GiB setup (6.5+) and SignPath/Actions must accept the
          # full pre-split installer artifact; a failure there blocks the build.
          python tools/release_archives.py stage-windows `
            --label "${{ needs.prepare.outputs.label }}" `
            --zip "OpenFocus-${{ needs.prepare.outputs.label }}-windows-x64.zip" `
            --setup "OpenFocus-${{ needs.prepare.outputs.label }}-setup.exe" `
            --out "dist/release-windows" `
            --recovery "tools/join_openfocus_parts.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_archives.py verify-stage `
            --manifest "dist/release-windows/OpenFocus-${{ needs.prepare.outputs.label }}-windows-assets.json" `
            --dir "dist/release-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-windows
          path: dist/release-windows/*
          retention-days: 7

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate .icns icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     assets/OpenFocus.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     assets/OpenFocus.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/OpenFocus.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     assets/OpenFocus.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/OpenFocus.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   assets/OpenFocus.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/OpenFocus.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   assets/OpenFocus.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   assets/OpenFocus.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/OpenFocus.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o OpenFocus.icns

      - name: Verify the shipped AI model is present
        run: |
          test -f weights/stackmff_v3_final.pth || { echo "Missing weights/stackmff_v3_final.pth - the release would ship without the AI model."; exit 1; }
          size=$(wc -c < weights/stackmff_v3_final.pth)
          if [ "$size" -lt 600000 ]; then echo "weights file is only $size bytes"; exit 1; fi
          echo "AI model present: $size bytes"

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --windowed \
            --name OpenFocus \
            --additional-hooks-dir hooks \
            --icon OpenFocus.icns \
            --add-data "assets:assets" \
            --add-data "weights:weights" \
            --add-data "ui:ui" \
            --add-data "docs:docs" \
            --collect-submodules fusion_methods \
            --collect-submodules locales \
            --hidden-import core.algorithm_adapters \
            --hidden-import core.depth_map \
            --hidden-import core.registration \
            --hidden-import core.torch_backend \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            --hidden-import PyQt6.QtNetwork \
            --collect-all scipy \
            --copy-metadata imageio \
            --collect-data dtcwt \
            --collect-all rawpy \
            --collect-all torch \
            --exclude-module torchvision \
            --exclude-module torch.test \
            --exclude-module torch.utils.tensorboard \
            --exclude-module torch.distributed \
            --exclude-module matplotlib \
            --exclude-module tkinter \
            --exclude-module IPython \
            --exclude-module pytest \
            --exclude-module PyQt6.QtWebEngineCore \
            --exclude-module PyQt6.Qt3DCore \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtBluetooth \
            --exclude-module PyQt6.QtDesigner \
            --exclude-module PyQt6.QtQuick \
            main.py

      - name: Prune build-only files from the bundle
        run: |
          # Headers, import libraries and CMake files are compile-time only;
          # they are a large share of the bundle and nothing reads them.
          APP=dist/OpenFocus.app
          find "$APP" -name '*.lib' -delete 2>/dev/null || true
          find "$APP" -name '*.pdb' -delete 2>/dev/null || true
          rm -rf "$APP"/Contents/Frameworks/torch/include 2>/dev/null || true
          rm -rf "$APP"/Contents/Resources/torch/include 2>/dev/null || true
          du -sh dist/OpenFocus.app || true

      - name: Verify packaged CLI and desktop control
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/frozen_cli_smoke.py --executable dist/OpenFocus.app/Contents/MacOS/OpenFocus

      - name: Ad-hoc codesign
        run: codesign --force --deep -s - dist/OpenFocus.app

      - name: Package zip (portable)
        run: ditto -c -k --keepParent dist/OpenFocus.app "OpenFocus-${{ needs.prepare.outputs.label }}-macos-arm64.zip"

      - name: Create DMG installer image
        run: |
          # `hdiutil create -srcfolder` fails with "Resource busy" when the
          # bundle it walks is still held (codesign/Spotlight/antivirus on a
          # freshly written .app). Stage a copy, detach anything left mounted,
          # and retry: the same command succeeded on re-run but failed the tag
          # build, which skipped the whole release job.
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          ditto dist/OpenFocus.app "$STAGE/OpenFocus.app"
          ln -s /Applications "$STAGE/Applications" || true
          hdiutil detach /Volumes/OpenFocus 2>/dev/null || true
          DMG="OpenFocus-${{ needs.prepare.outputs.label }}-macos.dmg"
          for attempt in 1 2 3; do
            if hdiutil create -volname "OpenFocus" -srcfolder "$STAGE" \
                 -fs HFS+ -format UDZO -ov "$DMG"; then
              echo "DMG created on attempt $attempt"
              break
            fi
            echo "hdiutil attempt $attempt failed; retrying in 10s"
            [ "$attempt" = 3 ] && { echo "DMG creation failed after 3 attempts"; exit 1; }
            sleep 10
          done
          ls -lh "$DMG"

      - uses: actions/upload-artifact@v5
        with:
          name: OpenFocus-macos
          path: |
            OpenFocus-*-macos-arm64.zip
            OpenFocus-*-macos.dmg
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    # Tags only: a workflow_dispatch run on a branch uploads downloadable
    # artifacts for acceptance testing and must never create or overwrite a
    # release (or its four stable assets).
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5  # CHANGELOG.md for the release notes
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: release

      - name: Create release notes
        env:
          WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          cat > release_notes.md <<'EOF'
          ## Downloads

          Windows downloads are available from **https://openfocus.top**.
          GitHub release assets for Windows are raw `.partNNN` chunks when the
          complete file would exceed GitHub's 2 GiB per-asset limit; use
          `OpenFocus-*-windows-assets.json` and `join-openfocus-parts.ps1` to
          rebuild the complete file, or download from the site.

          | Platform | File | Type |
          |----------|------|------|
          | Windows 10/11 (64-bit) | site download, or `OpenFocus-*-setup.exe[.partNNN]` | **Installer** (recommended) |
          | Windows 10/11 (64-bit) | site download, or `OpenFocus-*-windows-x64.zip[.partNNN]` | Portable (unzip and run) |
          | macOS Apple Silicon (M1/M2/M3/M4) | `OpenFocus-*-macos.dmg` | **Installer image** (recommended) |
          | macOS Apple Silicon (M1/M2/M3/M4) | `OpenFocus-*-macos-arm64.zip` | Portable (unzip) |

          [Code signing policy](https://github.com/${{ github.repository }}/blob/main/docs/CODE_SIGNING_POLICY.md)

          ## Installation

          ### Windows (installer)
          1. Run `OpenFocus-*-setup.exe`.
          2. Follow the wizard: choose the install folder, optionally create a desktop shortcut.
          3. Launch OpenFocus from the Start menu or desktop.

          If GitHub shows `OpenFocus-*-setup.exe.partNNN`, first download all
          parts, `OpenFocus-*-windows-assets.json` and
          `join-openfocus-parts.ps1` into one folder, then run:
          ```powershell
          powershell -ExecutionPolicy Bypass -File .\join-openfocus-parts.ps1 -Manifest .\OpenFocus-<tag>-windows-assets.json
          ```
          Replace `<tag>` with the release tag. The script verifies every
          part and the joined SHA-256 before writing the complete installer.

          ### Windows (portable)
          1. Unzip the downloaded file.
          2. Open the `OpenFocus` folder and double-click `OpenFocus.exe`.

          When the portable zip is split, join it with the same script first;
          the manifest verifies both the zip and setup files.

          ### macOS (DMG)
          1. Open `OpenFocus-*-macos.dmg`.
          2. Drag `OpenFocus.app` into your `Applications` folder.

          The app is unsigned, so SmartScreen/Gatekeeper may warn on first launch:
          - Windows: click "More info" → "Run anyway".
          - macOS: if you see *"cannot be opened"* or *"is damaged"*, run
            `xattr -cr /Applications/OpenFocus.app` in Terminal, then open normally.
            On macOS 15 Sequoia and later, right-click → Open no longer bypasses
            Gatekeeper; use System Settings → Privacy & Security → Open Anyway.

          ## Full history

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          EOF
          # "What's new" = this tag's CHANGELOG section, placed first: the
          # in-app update dialog shows release bodies as per-version notes,
          # and a body of install boilerplate told users nothing.
          python3 - "${{ github.ref_name }}" <<'PY'
          import os, re, sys
          tag = sys.argv[1]
          version = tag[1:] if tag.startswith('v') else tag
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[v?" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              raise SystemExit(f"No changelog section found for {tag}")
          notes = open("release_notes.md", encoding="utf-8").read()
          if os.environ.get("WINDOWS_SIGNED") == "true":
              notes = notes.replace(
                  "The app is unsigned, so SmartScreen/Gatekeeper may warn on first launch:",
                  "Windows builds are code-signed by SignPath Foundation (SmartScreen "
                  "may still warn until reputation accumulates); macOS builds are not "
                  "notarized:",
              )
          notes = "## What's new\n" + m.group(1).strip() + "\n\n" + notes
          open("release_notes.md", "w", encoding="utf-8").write(notes)
          PY

      - name: Verify the intended release assets
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          manifest="release/OpenFocus-${tag}-windows-assets.json"
          for name in \
            "OpenFocus-${tag}-macos.dmg" \
            "OpenFocus-${tag}-macos-arm64.zip" \
            "join-openfocus-parts.ps1" \
            "OpenFocus-${tag}-windows-assets.json"; do
            if [ ! -s "release/$name" ]; then
              echo "::error::Missing or empty intended release asset: $name"
              exit 1
            fi
          done
          python tools/release_archives.py verify-stage \
            --manifest "$manifest" --dir release
          echo "Release files (parts and whole assets):"
          find release -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          ls -lh release/

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          mapfile -t wanted < <(find release -maxdepth 1 -type f -printf '%f\n')
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              "OpenFocus-${tag}-"*)
                if ! printf '%s\n' "${wanted[@]}" | grep -Fxq "$name"; then
                  echo "Deleting stale asset: $name"
                  gh release delete-asset "$tag" "$name" \
                    --repo "${{ github.repository }}" -y
                fi
                ;;
            esac
          done < <(gh release view "$tag" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Files downloaded:"
          ls -la release/
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release/* \
              --repo "${{ github.repository }}" --clobber
            gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" \
              --title "OpenFocus ${{ github.ref_name }}" --notes-file release_notes.md \
              --draft=false --prerelease=false
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "OpenFocus ${{ github.ref_name }}" \
              --notes-file release_notes.md release/*
          fi

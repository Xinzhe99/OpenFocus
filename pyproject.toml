[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "openfocus"
description = "Multi-focus image fusion from the command line, with registration, classical methods, OpenFocus A/B/C and neural models"
readme = "README.md"
# PyQt6 and the PyPI wheel matrix support Python 3.10+; CI and packaged desktop
# builds run on Python 3.12, while advertising 3.9 produced an install that
# failed at import time.
requires-python = ">=3.10"
authors = [{ name = "Xinzhe Xie", email = "xiexinzheyyy@163.com" }]
license = "Apache-2.0 AND LicenseRef-StackMFF-V3-1.0"
license-files = ["LICENSE", "NOTICE", "docs/THIRD_PARTY_NOTICES.md"]
keywords = ["image-fusion", "focus-stacking", "multifocus", "microscopy", "photography", "depth-map"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "scipy",
    # Upstream 0.14.0 declares numpy<2, which cannot resolve on Python 3.13.
    # On newer Python versions it can be installed separately with --no-deps;
    # OpenFocus provides the NumPy 2 compatibility required by its backend.
    "dtcwt==0.14.0; python_version < '3.13'",
    "six",
    "imageio",
    "certifi",
    "Pillow",
    "psdtags==2024.5.24",
    "tifffile==2024.8.30",
    "imagecodecs>=2024.9.22",
    "onnxruntime-directml==1.23.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "onnxruntime>=1.23,<1.24; sys_platform != 'win32' or platform_machine != 'AMD64'",
    # Optional in practice, harmless to require: a few KB each, and they turn
    # HEIC and camera-RAW stacks from "unsupported" into "works" without a
    # second install step.
    "pillow-heif",
    # 0.25.1 bundles LibRaw 0.21.4 and still provides Intel macOS wheels.
    "rawpy>=0.25.1",
    "threadpoolctl>=3.5",
    "numba>=0.61.2",
    "pyopencl>=2025.2.7; sys_platform == 'win32' or sys_platform == 'darwin' or sys_platform == 'linux'",
]
dynamic = ["version"]

# `pip install openfocus` installs the headless CLI with its scientific and
# image format dependencies, including the runtime for experimental AI methods.

[project.scripts]
openfocus = "core.cli:main"

[project.urls]
Homepage = "https://github.com/Xinzhe99/OpenFocus"
Documentation = "https://github.com/Xinzhe99/OpenFocus#command-line-usage"
Changelog = "https://github.com/Xinzhe99/OpenFocus/blob/main/CHANGELOG.md"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["core", "fusion_methods", "utils", "weights", "locales"]
sdist.include = [
    "CMakeLists.txt",
    "cpp/**",
    "constants.py",
    "build_identity.py",
    "LICENSE",
    "NOTICE",
    "README.md",
    "docs/THIRD_PARTY_NOTICES.md",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "constants.py"
regex = 'APP_VERSION\s*=\s*"(?P<value>[^"]+)"'
